<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artesanías Mariana Pasinato</title>
  <style>
    :root {
      --primario:    #6b3f2a;
      --acento:      #c9843a;
      --fondo:       #fdf8f3;
      --superficie:  #ffffff;
      --texto:       #3b2a1a;
      --texto-claro: #7a6050;
      --borde:       #e0cfc0;
      --radio:       12px;
      --sombra:      0 4px 18px rgba(0,0,0,.10);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--fondo); color: var(--texto); min-height: 100vh; }

    /* Cabecera */
    header {
      background: linear-gradient(135deg, var(--primario) 0%, #4a2a18 100%);
      color: #fff;
      text-align: center;
      padding: 2.5rem 1.5rem 2rem;
    }
    header .logo-emoji { font-size: 3rem; display: block; margin-bottom: .5rem; }
    header h1 { font-size: clamp(1.6rem, 5vw, 2.5rem); font-weight: 800; line-height: 1.2; }
    header p.subtitulo { margin-top: .5rem; font-size: 1rem; opacity: .85; font-style: italic; }

    /* WhatsApp flotante */
    #btn-whatsapp {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 999;
      background: #25d366; color: #fff; border: none; border-radius: 50px;
      padding: .85rem 1.4rem; font-size: 1rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; gap: .55rem;
      box-shadow: 0 6px 22px rgba(37,211,102,.45); text-decoration: none;
      transition: transform .15s, box-shadow .15s;
    }
    #btn-whatsapp:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(37,211,102,.55); }
    #btn-whatsapp svg { width: 22px; height: 22px; flex-shrink: 0; }

    /* Main */
    main { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem 6rem; }

    #seccion-productos h2 {
      font-size: 1.5rem; color: var(--primario); margin-bottom: 1.5rem;
      padding-bottom: .5rem; border-bottom: 2px solid var(--borde);
      display: flex; align-items: center; gap: .5rem;
    }

    #contador-badge {
      font-size: .85rem; font-weight: 600; background: var(--acento);
      color: #fff; border-radius: 20px; padding: .15rem .7rem;
    }

    /* Grilla */
    #grilla-productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }

    /* Tarjeta */
    .tarjeta {
      background: var(--superficie); border-radius: var(--radio); box-shadow: var(--sombra);
      overflow: hidden; display: flex; flex-direction: column;
      transition: transform .2s, box-shadow .2s;
    }
    .tarjeta:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,.14); }

    .tarjeta-imagen {
      width: 100%; height: 200px; object-fit: cover; background: var(--fondo);
      display: flex; align-items: center; justify-content: center; font-size: 3.5rem; color: var(--borde);
    }
    .tarjeta-imagen img { width: 100%; height: 100%; object-fit: cover; }

    .tarjeta-cuerpo { padding: 1rem 1.1rem; flex: 1; display: flex; flex-direction: column; gap: .4rem; }
    .tarjeta-nombre { font-size: 1.05rem; font-weight: 700; color: var(--primario); }
    .tarjeta-descripcion { font-size: .88rem; color: var(--texto-claro); line-height: 1.5; flex: 1; }
    .tarjeta-precio { font-size: 1.25rem; font-weight: 800; color: var(--acento); margin-top: .4rem; }

    /* Vacío */
    #mensaje-vacio { text-align: center; padding: 3rem 1rem; color: var(--texto-claro); }
    #mensaje-vacio .emoji-grande { font-size: 3.5rem; display: block; }
    #mensaje-vacio p { margin-top: .75rem; }

    footer { text-align: center; padding: 1.5rem 1rem; font-size: .82rem; color: var(--texto-claro); border-top: 1px solid var(--borde); }

    @media (max-width: 400px) { #grilla-productos { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<header>
  <span class="logo-emoji">🧶</span>
  <h1>Artesanías Mariana Pasinato</h1>
  <p class="subtitulo">Piezas únicas hechas con amor ✨</p>
</header>

<main>

</main>

  /* Renderizar catálogo */
  var grilla   = document.getElementById('grilla-productos');
  var vacio    = document.getElementById('mensaje-vacio');
  var contador = document.getElementById('contador-badge');

  contador.textContent = productos.length;
  vacio.style.display  = productos.length === 0 ? 'block' : 'none';

  productos.forEach(function(p) {
    var tarjeta = document.createElement('article');
    tarjeta.className = 'tarjeta';

    var divImg = document.createElement('div');
    divImg.className = 'tarjeta-imagen';

    if (p.imagenBase64) {
      var img = document.createElement('img');
      img.src = p.imagenBase64;
      img.alt = p.nombre;
      divImg.appendChild(img);
    } else {
      divImg.textContent = '\uD83D\uDDBC\uFE0F';
    }

    var cuerpo = document.createElement('div');
    cuerpo.className = 'tarjeta-cuerpo';

    var nombre = document.createElement('p');
    nombre.className   = 'tarjeta-nombre';
    nombre.textContent = p.nombre;
    cuerpo.appendChild(nombre);

    if (p.descripcion) {
      var desc = document.createElement('p');
      desc.className   = 'tarjeta-descripcion';
      desc.textContent = p.descripcion;
      cuerpo.appendChild(desc);
    }

    var precio = document.createElement('p');
    precio.className   = 'tarjeta-precio';
    precio.textContent = p.precio;
    cuerpo.appendChild(precio);

    tarjeta.appendChild(divImg);
    tarjeta.appendChild(cuerpo);
    grilla.appendChild(tarjeta);
  });
</script>
